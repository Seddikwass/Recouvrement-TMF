<style>
:root{--f:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--b:#0a2a5c;--d:#071230;--r:#0a2a5c;--w:#fff;--l:#e8eef8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;font:17px/1.5 var(--f);-webkit-font-smoothing:antialiased;background:var(--d);color:#111}
body{padding:0 12px 80px}
header{display:flex;align-items:center;gap:12px;padding:12px 0;color:#fff}
.logo{height:64px;width:auto;background:#fff;border-radius:8px;padding:3px}
h1{font-size:24px;margin:0;color:#fff;font-weight:800;letter-spacing:.5px}
.lay{display:block}main{min-width:0}
#mb{display:none;background:transparent;border:2px solid #2a3a63;color:#fff;font-size:24px;line-height:1;padding:8px 12px;margin:0;border-radius:10px}body.in #mb{display:block}
nav{position:fixed;top:0;left:0;bottom:0;width:240px;max-width:80vw;z-index:40;background:#071230;border-right:2px solid #2a3a63;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 90px;display:flex;flex-direction:column;gap:8px;overflow:auto;transform:translateX(-105%);transition:transform .22s ease}
body.mo nav{transform:none;box-shadow:6px 0 24px #0008}#scrim{display:none;position:fixed;inset:0;background:#0007;z-index:35}body.mo #scrim{display:block}
nav .nh{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;font-size:18px;margin-bottom:6px}nav .nh button{background:transparent;border:0;font-size:26px;padding:2px 8px;margin:0}
nav button.it{width:100%;margin:0;padding:12px 14px;background:#141f3b;color:#fff;border:2px solid #2a3a63;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;font-size:17px;font-weight:700}
nav button.it i{font-style:normal;font-size:22px}nav button.it.on{background:#fff;color:#0a2a5c;border-color:#fff}
.chs{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:1000px){.chs{grid-template-columns:3fr 2fr}}
.dn{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px}
button{font:700 16px var(--f);letter-spacing:.2px;background:var(--b);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin:2px}
button.sec{background:var(--l);color:#0a2a5c}button.red{background:var(--r)}button.sm{padding:6px 10px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;overflow-x:auto}
h2{color:var(--r);margin:0 0 12px;font-size:22px;font-weight:800}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.k div{background:var(--l);border-left:6px solid var(--b);border-radius:8px;padding:10px}.k b{display:block;font-size:22px;color:#0a2a5c;font-weight:800}
table{border-collapse:collapse;width:100%;min-width:640px}th{background:var(--b);color:#fff;text-align:left}
th,td{padding:10px 8px;border-bottom:1px solid #d5deea;font-size:16px;line-height:1.4}td{color:#111}th{font-weight:700;font-size:15px}small{font-size:14px;color:#333}
tr.rP td{background:#d7ebff;color:#0a2a5c}.pB{display:inline-block;background:#0D51A1;color:#fff;font-weight:800;font-size:13px;border-radius:6px;padding:2px 8px}tr.rE td{background:#fde0e1;font-weight:700}tr.rY td{background:#fff4c2}
.bd{display:inline-block;min-width:28px;text-align:center;border-radius:6px;color:#fff;font-weight:900;padding:2px 6px}
.cA{background:#c3d1e8;color:#0a2a5c}.cB{background:#0D51A1;color:#fff}.cC{background:#f5c400;color:#111}.cD{background:#e0a800;color:#111}.cE{background:#D40005;color:#fff}
label{display:block;font-weight:700;margin:10px 0;color:#0a2a5c;font-size:16px}
input,select,textarea{width:100%;font:17px var(--f);color:#111;padding:9px;border:2px solid #9db3d1;border-radius:8px;margin-top:3px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ov{position:fixed;inset:0;background:#000a;z-index:20;overflow:auto;padding:12px}
.mo{background:#fff;border-radius:12px;max-width:720px;margin:0 auto;padding:16px}
footer{position:fixed;left:0;right:0;bottom:0;background:#0a2a5c;border-top:1px solid #2a3a63;color:#fff;text-align:center;font-weight:900;padding:12px 8px calc(12px + env(safe-area-inset-bottom,0px));letter-spacing:1px;z-index:10}
.lg span{display:inline-block;margin-right:14px}.lg i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:4px;vertical-align:middle}
.err{color:var(--r);font-weight:700}
.yb{display:inline-block;color:#fff;font-weight:800;border-radius:8px;padding:4px 10px}.ct{min-width:560px}.ct td{border-bottom:1px solid #fff}.ct tr.tt td{color:#fff;font-weight:900;font-size:17px}.yc h2{font-size:21px}
button.pay{background:#d7ebff;color:#0a2a5c;border:2px solid #0D51A1}
.xl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}.xl button,.xl .bt{margin:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;font:700 15px var(--f);background:var(--l);color:#0a2a5c;border:2px solid #b9c9e3;border-radius:10px;cursor:pointer;text-align:center}.xl i{font-style:normal;font-size:20px}
.al{border-radius:10px;padding:12px 14px;margin-bottom:10px;font-weight:900;cursor:pointer}.alE{background:#D40005;color:#fff;border:2px solid #fff}.alY{background:#f5c400;color:#111;border:2px solid #fff}
</style></head><body>

const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CELLS=['CARRIER','KAESER','TRANSICOLD'];
let db,user,dl,admin=false,me='Utilisateur',L=0,auto=false,tab='dash',flt='',cf='',q='',pend=null;
const S={clients:[],invoices:[],relances:[],clotures:[],cfg:{b:30,c:90,d:365}};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const fdt=t=>new Date(t).toLocaleString('fr-FR');
const m=n=>(+n||0).toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3})+' TND';
const rest=i=>Math.max(0,(+i.montant||0)-(+i.paye||0));
const late=i=>rest(i)>0?days(i.echeance||i.date,today()):0;
const sum=a=>a.reduce((s,x)=>s+x,0);
const cname=id=>(S.clients.find(c=>c.id===id)||{}).rs||'?';
const lastClose=()=>(new Date().getFullYear()-1)+'-12-31';
const isE=i=>rest(i)>0&&days(i.echeance||i.date,lastClose())>365;
const stB=i=>rest(i)<=0?`<span class="pB">✔ PAYÉE</span>${i.datePaiement?'<br><small>le '+fd(i.datePaiement)+'</small>':''}`:status(i);
async function payInv(id){if(!admin)return alert('Réservé à l’administrateur.');const i=S.invoices.find(x=>x.id===id);if(!confirm('Marquer la facture '+i.num+' comme payée ('+m(i.montant)+') ?'))return;
await db.doc('invoices/'+id).set({paye:+i.montant||0,datePaiement:today()},{merge:true});await db.collection('relances').add({inv:id,client:i.client,ts:new Date().toISOString(),canal:'paiement',type:'—',pj:'',note:'Facture marquée payée',user:me})}
function status(i){if(rest(i)<=0)return'payée';if(isE(i))return'perte potentielle';return +i.paye>0?'partiellement payée':'impayée'}
function icl(i){if(isE(i))return'E';const l=late(i),g=S.cfg;return l<=0?'A':l<=g.b?'B':l<=g.c?'C':'D'}
function ccl(id){const L=S.invoices.filter(i=>i.client===id&&rest(i)>0);if(L.some(isE))return'E';const l=Math.max(0,...L.map(late)),g=S.cfg;return l<=0?'A':l<=g.b?'B':l<=g.c?'C':'D'}
const rc=k=>k=='E'?'rE':(k=='C'||k=='D')?'rY':'';
const bd=k=>`<span class="bd c${k}">${k}</span>`;
const invF=()=>S.invoices.filter(i=>!flt||i.cell===flt);
function clot(Y,list){return list.filter(i=>rest(i)>0&&days(i.echeance||i.date,Y+'-12-31')>365)}

/* ---------- données ---------- */
function autoArch(){if(auto||!admin||L<4)return;auto=true;const cy=new Date().getFullYear();for(let Y=2022;Y<cy;Y++)if(!S.clotures.find(c=>c.id===''+Y))arch(Y)}
async function arch(Y){const l=clot(Y,S.invoices);await db.doc('clotures/'+Y).set({year:Y,total:sum(l.map(rest)),n:l.length,at:new Date().toISOString(),list:l.slice(0,400).map(i=>({num:i.num,client:cname(i.client),cell:i.cell||'',ech:i.echeance||i.date||'',reste:rest(i)}))})}
async function del(col,id){if(!admin)return alert('Réservé à l’administrateur.');if(confirm('Confirmer la suppression ?'))await db.doc(col+'/'+id).delete()}
const modal=h=>{$('#md').innerHTML='<div class="ov"><div class="mo">'+h+'</div></div>'};
const closeM=()=>{$('#md').innerHTML=''};
const inp=(i,l,v,t='text')=>`<label>${l}<input id="f_${i}" type="${t}" value="${E(v)}"></label>`;
const ta=(i,l,v)=>`<label>${l}<textarea id="f_${i}" rows="3">${E(v)}</textarea></label>`;
const sel=(i,l,o,v)=>`<label>${l}<select id="f_${i}">${o.map(x=>`<option value="${E(x[0])}" ${x[0]==v?'selected':''}>${E(x[1])}</option>`).join('')}</select></label>`;
const v=i=>$('#f_'+i).value.trim();

/* ---------- clients ---------- */
function fClient(id){if(id&&!admin)return alert('Modification réservée à l’administrateur.');const c=S.clients.find(x=>x.id===id)||{};
modal(`<h2>${id?'Modifier':'Nouveau'} client</h2>${inp('rs','Raison sociale',c.rs)}${inp('mf','Matricule fiscal',c.mf)}${inp('rue','Rue',c.rue)}
<div class="g">${inp('ville','Ville',c.ville)}${inp('cp','Code postal',c.cp)}${inp('pays','Pays',c.pays||'Tunisie')}</div>
${ta('em','E-mails (un par ligne)',(c.em||[]).join('\n'))}${ta('tel','Téléphones (un par ligne, ajouter « wa » à la fin si WhatsApp)',(c.tel||[]).map(t=>t.n+(t.wa?' wa':'')).join('\n'))}
${inp('ct','Personne de contact',c.ct)}${ta('nt','Note client',c.nt)}
<button onclick="svClient('${id||''}')">Enregistrer</button><button class="sec" onclick="closeM()">Annuler</button>`)}
const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
const tels=s=>lines(s).map(x=>({n:x.replace(/\s+wa$/i,'').trim(),wa:/\swa$/i.test(x)}));
async function svClient(id){if(!v('rs'))return alert('Raison sociale obligatoire.');
const d={rs:v('rs'),mf:v('mf'),rue:v('rue'),ville:v('ville'),cp:v('cp'),pays:v('pays'),em:lines($('#f_em').value),tel:tels($('#f_tel').value),ct:v('ct'),nt:v('nt')};
await db.doc('clients/'+(id||db.collection('clients').doc().id)).set(d);closeM()}
function vClient(id){const c=S.clients.find(x=>x.id===id),l=S.invoices.filter(i=>i.client===id);
modal(`<h2>${E(c.rs)} ${bd(ccl(id))}</h2><p>MF : ${E(c.mf)}<br>${E([c.rue,c.cp,c.ville,c.pays].filter(Boolean).join(', '))}<br>Contact : ${E(c.ct)}<br>E-mails : ${E((c.em||[]).join(', '))}<br>Tél. : ${E((c.tel||[]).map(t=>t.n+(t.wa?' (WhatsApp)':'')).join(', '))}<br>Note : ${E(c.nt)}</p>
<p><b>Facturé :</b> ${m(sum(l.map(i=>+i.montant||0)))} · <b>Impayé :</b> ${m(sum(l.map(rest)))}</p>
<table><tr><th>N°</th><th>Reste</th><th>Statut</th><th></th></tr>${l.map(i=>`<tr class="${rest(i)<=0?'rP':rc(icl(i))}"><td>${E(i.num)}</td><td>${m(rest(i))}</td><td>${stB(i)}</td><td><button class="sm red" onclick="fRel('${i.id}')">Relancer</button></td></tr>`).join('')}</table>
<button class="sec" onclick="closeM()">Fermer</button>`)}
function v_cl(){const l=S.clients.filter(c=>(!cf||ccl(c.id)===cf)&&(!q||c.rs.toLowerCase().includes(q.toLowerCase())));
return `<div class="card"><div class="xl"><button onclick="exp('C')"><i>⬇</i>Exporter Excel</button><label class="bt"><i>⬆</i>Importer Excel<input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="impF(this.files[0],'Clients');this.value=''"></label><button onclick="modele('C')"><i>📄</i>Modèle</button></div><h2>Clients ${cf?'– classe '+cf:''}</h2><button onclick="fClient()">+ Nouveau client</button><div id="pv">${pvH}</div>${cf?'<button class="sec" onclick="cf=\'\';render()">Tous</button>':''}
<input placeholder="Rechercher…" value="${E(q)}" id="qs" oninput="q=this.value;render()" style="max-width:300px;display:inline-block">
<table><tr><th>Client</th><th>Classe</th><th>Facturé</th><th>Impayé</th><th></th></tr>${l.map(c=>{const k=ccl(c.id),x=S.invoices.filter(i=>i.client===c.id);

/* ---------- Excel ---------- */
function v_io(){return `<div class="card"><h2>Export Excel</h2><p>Clients et factures (filtre cellule : ${flt||'toutes'}).</p>${fsel()}<button onclick="exp('T')">Exporter .xlsx</button></div>
<div class="card"><h2>Import Excel</h2><p>Classeur avec les feuilles <b>Clients</b> (Raison sociale, Matricule fiscal, Rue, Ville, Code postal, Pays, E-mails, Téléphones, Contact, Note) et <b>Factures</b> (Client, Cellule, N° facture, Date, Échéance, Montant, Payé, Nature, Rapport signé, Technicien, Avis technique). La colonne Cellule est obligatoire. E-mails et téléphones séparés par « ; ».</p>
<input type="file" accept=".xlsx" onchange="impF(this.files[0])"><div id="pv">${pvH}</div></div>`}
const shC=()=>XLSX.utils.json_to_sheet(S.clients.map(c=>({'Raison sociale':c.rs,'Matricule fiscal':c.mf,'Rue':c.rue,'Ville':c.ville,'Code postal':c.cp,'Pays':c.pays,'E-mails':(c.em||[]).join(';'),'Téléphones':(c.tel||[]).map(t=>t.n+(t.wa?' wa':'')).join(';'),'Contact':c.ct,'Note':c.nt})));
const shF=()=>XLSX.utils.json_to_sheet(invF().map(i=>({'Client':cname(i.client),'Cellule':i.cell,'N° facture':i.num,'Date':fd(i.date),'Échéance':fd(i.echeance),'Montant':i.montant,'Payé':i.paye,'Nature':i.nature,'Rapport signé':i.rapport,'Technicien':i.tech||'','Avis technique':i.avis})));
function exp(k){const wb=XLSX.utils.book_new();if(k!='F')XLSX.utils.book_append_sheet(wb,shC(),'Clients');if(k!='C')XLSX.utils.book_append_sheet(wb,shF(),'Factures');XLSX.writeFile(wb,k=='C'?'clients-tmf.xlsx':k=='F'?'factures-tmf.xlsx':'recouvrement-tmf.xlsx')}
function modele(k){const wb=XLSX.utils.book_new();if(k=='C')XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{'Raison sociale':'SOCIETE EXEMPLE','Matricule fiscal':'1234567/A/M/000','Rue':'Rue de la Liberté','Ville':'Tunis','Code postal':'1000','Pays':'Tunisie','E-mails':'compta@exemple.tn;dg@exemple.tn','Téléphones':'71000000;98000000 wa','Contact':'M. Ben Ali','Note':''}]),'Clients');else XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{'Client':'SOCIETE EXEMPLE','Cellule':'CARRIER','N° facture':'FA2026-001','Date':'15/10/2026','Échéance':'14/11/2026','Montant':1500,'Payé':0,'Nature':'Prestation + Pièces','Rapport signé':'Oui','Technicien':'Nom du technicien','Avis technique':''}]),'Factures');XLSX.writeFile(wb,k=='C'?'modele-clients.xlsx':'modele-factures.xlsx')}
function pd(x){if(typeof x=='number')return new Date(Math.round((x-25569)*864e5)).toISOString().slice(0,10);x=String(x||'').trim();if(/^\d{4}-\d\d-\d\d/.test(x))return x.slice(0,10);const p=x.split('/');return p.length==3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:''}
let pvH='';function setPv(h){pvH=h;const e=$('#pv');if(e)e.innerHTML=h}
function impF(f,only){if(!f)return;const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'}),rows=n=>{const sh=wb.Sheets[n]||(only==n?wb.Sheets[wb.SheetNames[0]]:null);return sh?XLSX.utils.sheet_to_json(sh):[]},er=[],cl=[],iv=[],known=new Set(S.clients.map(c=>c.rs.toLowerCase()));
rows('Clients').forEach((x,k)=>{const rs=String(x['Raison sociale']||'').trim();if(!rs)return er.push('Clients ligne '+(k+2)+' : raison sociale vide');if(known.has(rs.toLowerCase()))return;known.add(rs.toLowerCase());
cl.push({rs,mf:x['Matricule fiscal']||'',rue:x['Rue']||'',ville:x['Ville']||'',cp:x['Code postal']||'',pays:x['Pays']||'Tunisie',em:String(x['E-mails']||'').split(';').map(s=>s.trim()).filter(Boolean),tel:tels(String(x['Téléphones']||'').split(';').join('\n')),ct:x['Contact']||'',nt:x['Note']||''})});
const nums=new Set(S.invoices.map(i=>nn(i.num)));let dup=0;
rows('Factures').forEach((x,k)=>{const c=String(x['Cellule']||'').toUpperCase().trim(),n=String(x['N° facture']||'').trim(),cn=String(x['Client']||'').trim(),mt=+x['Montant'];
if(!CELLS.includes(c))return er.push('Factures ligne '+(k+2)+' : cellule invalide');if(!n||!(mt>0)||!pd(x['Date']))return er.push('Factures ligne '+(k+2)+' : n°, date ou montant invalide');if(!known.has(cn.toLowerCase()))return er.push('Factures ligne '+(k+2)+' : client inconnu');if(nums.has(nn(n))){dup++;return}nums.add(nn(n));
iv.push({cn,cell:c,num:n,date:pd(x['Date']),echeance:pd(x['Échéance'])||pd(x['Date']),montant:mt,paye:+x['Payé']||0,nature:x['Nature']||'Prestation',rapport:x['Rapport signé']||'Non',tech:x['Technicien']||'',avis:x['Avis technique']||''})});
pend={cl,iv};setPv(`<p><b>${cl.length}</b> nouveau(x) client(s), <b>${iv.length}</b> nouvelle(s) facture(s).${dup?` <br>${dup} facture(s) ignorée(s) : numéro déjà existant.`:''}</p>${er.length?'<p class="err">'+er.slice(0,15).map(E).join('<br>')+'</p>':''}<button onclick="okImp()">Valider l’import</button> <button class="sec" onclick="setPv('')">Annuler</button>`)};r.readAsArrayBuffer(f)}
async function okImp(){const ids={};S.clients.forEach(c=>ids[c.rs.toLowerCase()]=c.id);for(const c of pend.cl){const r=db.collection('clients').doc();ids[c.rs.toLowerCase()]=r.id;await r.set(c)}
for(const i of pend.iv){const{cn,...d}=i;await db.collection('invoices').doc().set({...d,client:ids[cn.toLowerCase()]})}pend=null;setPv('<p><b>Import terminé ✅</b></p>')}

/* ---------- affichage ---------- */
const tg=o=>document.body.classList.toggle('mo',o===undefined?undefined:!!o);
const go=k=>{tab=k;q='';pvH='';tg(0);render();scrollTo(0,0)};
const V={cls:v_cls,dash:v_dash,cl:v_cl,inv:v_inv,clo:v_clo,io:v_io};
function render(){if(!db||!user)return vLogin();
if(document.activeElement&&document.activeElement.tagName=='INPUT'&&document.activeElement.type=='file')return;
document.body.classList.add('in');$('#app').innerHTML=`<div class="lay"><div id="scrim" onclick="tg(0)"></div><nav><div class="nh">Menu<button onclick="tg(0)" aria-label="Fermer">✕</button></div>${[['dash','📊','Tableau de bord'],['cl','👥','Clients'],['inv','🧾','Factures'],['cls','🏅','Classement clients'],['clo','📅','Clôture'],['acc','👤','Mon compte']].map(([k,ic,l])=>`<button class="it ${tab==k?'on':''}" onclick="go('${k}')"><i>${ic}</i>${l}</button>`).join('')}</nav><main>${V[tab]()}</main></div>`;const e=$('#qs');if(e&&q){e.focus();e.setSelectionRange(q.length,q.length)}}
/* ---------- connexion / compte ---------- */
const ERR={'auth/invalid-credential':'E-mail ou mot de passe incorrect.','auth/wrong-password':'Mot de passe incorrect.','auth/user-not-found':'Aucun compte avec cet e-mail. Cliquez sur « Créer un compte ».','auth/invalid-email':'Adresse e-mail invalide.','auth/email-already-in-use':'Ce compte existe déjà : connectez-vous, ou utilisez « Mot de passe oublié ».','auth/weak-password':'Mot de passe trop court (6 caractères minimum).','auth/too-many-requests':'Trop de tentatives. Patientez quelques minutes ou réinitialisez le mot de passe.','auth/network-request-failed':'Pas de connexion Internet.','auth/requires-recent-login':'Par sécurité, reconnectez-vous puis recommencez.','auth/missing-password':'Saisissez le mot de passe.'};
const errMsg=e=>ERR[e&&e.code]||('Erreur : '+((e&&e.message)||e));
let lmsg='',lok='';
function vLogin(){document.body.classList.remove('in','mo');if(!db){$('#app').innerHTML='<div class="card"><h2>Configuration requise</h2><p>Collez la configuration de votre projet Firebase en haut du fichier <b>index.html</b> (bloc « CONFIGURATION FIREBASE »), puis redéployez.</p></div>';return}
$('#app').innerHTML=`<div class="card" style="max-width:440px;margin:24px auto"><h2>Connexion</h2>${lmsg?`<p class="err">${E(lmsg)}</p>`:''}${lok?`<p style="color:#0D51A1;font-weight:700">${E(lok)}</p>`:''}
<label>E-mail professionnel<input id="l_e" type="email" autocomplete="username" value="${E(window._le||'')}"></label>
<label>Mot de passe<input id="l_p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></label>
<button onclick="doLogin()">Se connecter</button><button class="sec" onclick="doSignup()">Créer un compte</button><button class="sec" onclick="doReset()">Mot de passe oublié</button></div>`}
const lv=()=>{window._le=$('#l_e').value.trim();return[window._le,$('#l_p').value]};
async function doLogin(){const[e,p]=lv();lmsg=lok='';try{await firebase.auth().signInWithEmailAndPassword(e,p)}catch(x){lmsg=errMsg(x);vLogin()}}
async function doSignup(){const[e,p]=lv();lmsg=lok='';
try{await firebase.auth().createUserWithEmailAndPassword(e,p)}catch(x){lmsg=errMsg(x);vLogin()}}
async function doReset(){const[e]=lv();lmsg=lok='';if(!e){lmsg='Saisissez votre e-mail puis cliquez sur « Mot de passe oublié ».';return vLogin()}
try{await firebase.auth().sendPasswordResetEmail(e);lok='E-mail de réinitialisation envoyé à '+e+' (vérifiez aussi les courriers indésirables).'}catch(x){lmsg=errMsg(x)}vLogin()}
function v_acc(){return `${admin?v_users():''}<div class="card"><h2>Mon compte</h2><p>Connecté : <b>${E(user.email)}</b><br>Rôle : <b>${admin?'Administrateur':'Utilisateur'}</b></p><button class="red" onclick="firebase.auth().signOut()">Se déconnecter</button></div>
<div class="card"><h2>Changer le mot de passe</h2><label>Mot de passe actuel<input id="p_o" type="password" autocomplete="current-password"></label><label>Nouveau mot de passe<input id="p_n" type="password" autocomplete="new-password"></label><label>Confirmer<input id="p_c" type="password" autocomplete="new-password"></label><button onclick="chPw()">Enregistrer le nouveau mot de passe</button><div id="p_m"></div></div>`}
async function chPw(){const o=$('#p_o').value,n=$('#p_n').value,c=$('#p_c').value,out=t=>$('#p_m').innerHTML=t;
if(n.length<6)return out('<p class="err">6 caractères minimum.</p>');if(n!==c)return out('<p class="err">Les deux mots de passe ne correspondent pas.</p>');
try{await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,o));await user.updatePassword(n);out('<p style="color:#0D51A1;font-weight:700">Mot de passe modifié.</p>');['p_o','p_n','p_c'].forEach(i=>$('#'+i).value='')}catch(x){out('<p class="err">'+E(errMsg(x))+'</p>')}}
V.acc=v_acc;

/* ---------- utilisateurs (administrateurs) ---------- */
let roleMe=null;
const ROLES={admin:'Administrateur',user:'Utilisateur'};
function v_users(){const l=[...S.roles].sort((a,b)=>a.id.localeCompare(b.id));
return `<div class="card"><h2>Utilisateurs</h2><p>Ajoutez l’e-mail d’un collègue et son rôle. Il ouvre ensuite l’application et appuie sur <b>Créer un compte</b> avec cet e-mail pour choisir son mot de passe.</p>
<div class="g">${inp('ue','E-mail du collègue','','email')}${sel('ur','Rôle',[['user','Utilisateur (consultation, ajout, relances)'],['admin','Administrateur (tous les droits)']],'user')}</div>
<button onclick="addU()">+ Ajouter l’utilisateur</button><div id="um"></div>
<table><tr><th>E-mail</th><th>Rôle</th><th></th></tr><tr><td>${E(ADMINS[0])}</td><td><b>Administrateur principal</b></td><td></td></tr>
${l.filter(r=>!ADMINS.includes(r.id)).map(r=>`<tr><td>${E(r.id)}</td><td><select onchange="setU('${E(r.id)}',this.value)">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${r.role==k?'selected':''}>${v}</option>`).join('')}</select></td><td><button class="sm red" onclick="delU('${E(r.id)}')">Retirer</button></td></tr>`).join('')}</table></div>`}
async function addU(){const e=v('ue').toLowerCase(),r=v('ur');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return $('#um').innerHTML='<p class="err">Adresse e-mail invalide.</p>';
if(ADMINS.includes(e)||S.roles.some(x=>x.id===e))return $('#um').innerHTML='<p class="err">Cet utilisateur existe déjà.</p>';
await db.doc('roles/'+e).set({role:r,by:user.email,at:new Date().toISOString()})}
async function setU(e,r){await db.doc('roles/'+e).set({role:r,by:user.email,at:new Date().toISOString()},{merge:true})}
async function delU(e){if(confirm('Retirer l’accès de '+e+' ?'))await db.doc('roles/'+e).delete()}
function vRefus(){document.body.classList.remove('in','mo');$('#app').innerHTML=`<div class="card" style="max-width:440px;margin:24px auto"><h2>Accès non autorisé</h2><p>Le compte <b>${E(user.email)}</b> n’a pas encore été ajouté par un administrateur.</p><p>Demandez à l’administrateur de vous ajouter dans <b>Mon compte → Utilisateurs</b>, puis reconnectez-vous.</p><button class="red" onclick="firebase.auth().signOut()">Se déconnecter</button></div>`}
/* ---------- démarrage ---------- */
let UN=[];
function sub(n,k){UN.push(db.collection(n).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));L++;render();autoArch()},e=>{console.error(e);if(e.code=='permission-denied'&&n!='roles')alert('Accès refusé par la base de données : vérifiez les règles Firestore.')}))}
(()=>{if(String(firebaseConfig.apiKey).startsWith('COLLER'))return vLogin();
firebase.initializeApp(firebaseConfig);db=firebase.firestore();
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
vLogin();
firebase.auth().onAuthStateChanged(u=>{UN.forEach(f=>f());UN=[];L=0;auto=false;Object.assign(S,{clients:[],invoices:[],relances:[],clotures:[],roles:[]});roleMe=null;
user=u;if(!u){admin=false;tab='dash';return vLogin()}
const em=(u.email||'').toLowerCase();me=u.email;lmsg=lok='';let started=false;
const start=()=>{if(started)return;started=true;sub('clients','clients');sub('invoices','invoices');sub('relances','relances');sub('clotures','clotures');
UN.push(db.doc('config/seuils').onSnapshot(s=>{if(s.exists)S.cfg=s.data();render()},()=>{}));if(admin)sub('roles','roles');render()};
if(ADMINS.includes(em)){admin=true;start();return}
UN.push(db.doc('roles/'+em).onSnapshot(d=>{if(!d.exists){admin=false;return vRefus()}const was=admin;admin=d.data().role=='admin';if(started&&was!==admin){location.reload();return}start();render()},()=>vRefus()))})})();
if('serviceWorker' in navigator){let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl){rl=true;location.reload()}});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(()=>{})}
</script></body></html>
